name: Publish to PyPI

run-name: Publish ${{ inputs.tag }} to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed GitHub release tag to publish
        required: true
        type: string

permissions: {}

jobs:
  verify-distributions:
    name: Verify release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate release identity
        shell: sh
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "unsupported release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          version=${RELEASE_TAG#v}
          project_version=$(
            python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])'
          )
          if [ "$project_version" != "$version" ]; then
            echo "tag version $version does not match package version $project_version" >&2
            exit 1
          fi
          if [ "$(git describe --tags --exact-match)" != "$RELEASE_TAG" ]; then
            echo "checkout does not match tag $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Download published release assets
        shell: sh
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --pattern "danvas_cli-*.whl" \
            --pattern "danvas_cli-*.tar.gz" \
            --pattern "SHA256SUMS" \
            --dir dist
      - name: Verify checksums and distribution contract
        shell: sh
        run: |
          version=${RELEASE_TAG#v}
          wheel="dist/danvas_cli-$version-py3-none-any.whl"
          sdist="dist/danvas_cli-$version.tar.gz"
          test -f "$wheel"
          test -f "$sdist"
          test -f dist/SHA256SUMS
          if [ "$(find dist -type f | wc -l | tr -d ' ')" -ne 3 ]; then
            echo "release must contain exactly one wheel, one sdist, and SHA256SUMS" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum -c SHA256SUMS
          )
          python scripts/check-distributions.py \
            "$wheel" "$sdist" --expected-version "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: |
            dist/danvas_cli-*.whl
            dist/danvas_cli-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: verify-distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/danvas-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
