name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run ty check
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable
      - name: Test
        run: uv run pytest

  install-smoke:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
      - name: Build and verify isolated CLI installs
        shell: sh
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            scripts/release-smoke.sh --expected-version "${GITHUB_REF_NAME#v}"
          else
            scripts/release-smoke.sh
          fi
