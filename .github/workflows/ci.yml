name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run ty check
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable
      - name: Test
        run: |
          uv run pytest --cov=danvas --cov-branch --cov-report=term-missing \
            --cov-report=json:/tmp/danvas-coverage.json --cov-fail-under=82
          uv run python scripts/check-module-coverage.py \
            /tmp/danvas-coverage.json src/danvas/authored_assets.py 82

  install-smoke:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.14"
      - name: Build and verify isolated CLI installs
        shell: sh
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            scripts/release-smoke.sh --expected-version "${GITHUB_REF_NAME#v}"
          else
            scripts/release-smoke.sh
          fi
