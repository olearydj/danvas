[project]
name = "danvas-cli"
version = "0.18.0"
description = "Safety-focused command-line tools for day-to-day Canvas course operations"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dan O'Leary" },
]
maintainers = [
    { name = "Dan O'Leary" },
]
keywords = ["canvas", "education", "instructor", "lms", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "canvasapi>=3.3",
    "markdown>=3.6",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tinycss2>=1.4",
    "typer>=0.19",
]

[project.urls]
Repository = "https://github.com/olearydj/danvas"
Issues = "https://github.com/olearydj/danvas/issues"
Documentation = "https://github.com/olearydj/danvas#readme"
Changelog = "https://github.com/olearydj/danvas/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
branch = true
source = ["danvas"]

[tool.coverage.report]
fail_under = 82
show_missing = true

[project.scripts]
danvas = "danvas.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "danvas"
module-root = "src"
