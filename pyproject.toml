[project]
name = "danvas"
version = "0.15.0"
description = "Unified operational Canvas CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "canvasapi>=3.3",
    "markdown>=3.6",
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "secretpath>=0.3.0",
    "tinycss2>=1.4",
    "typer>=0.19",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
branch = true
source = ["danvas"]

[tool.coverage.report]
fail_under = 82
show_missing = true

[tool.uv.exclude-newer-package]
secretpath = "2026-06-25T00:00:00Z"

[project.scripts]
danvas = "danvas.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "danvas"
module-root = "src"
